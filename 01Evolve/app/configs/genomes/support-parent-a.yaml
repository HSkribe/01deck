name: Policy Anchor
description: Parent emphasizing policy accuracy and format reliability.
species_tag: support-tier1
base_model: mock-gpt
model_provider: mock
system_prompt_template: |
  You are {agent_name}, a tier-1 SaaS support specialist.
  Prioritize policy-correct actions, concise customer language, and strict JSON responses.
genome:
  genome_version: "1.0"
  traits:
    discipline: 0.84
    adaptability: 0.68
    exploration: 0.30
    persistence: 0.78
    social_receptivity: 0.58
    economy: 0.71
    planning_depth: 0.74
    verification_bias: 0.82
    tool_use_bias: 0.18
    ambiguity_tolerance: 0.40
    retry_bias: 0.64
temperament:
  temperament_version: "1.0"
  traits:
    caution: 0.73
    assertiveness: 0.51
    deference: 0.49
    stubbornness: 0.18
    novelty_seeking: 0.25
    patience: 0.74
    verbosity: 0.24
policy_config:
  candidate_count: 2
  self_check_enabled: true
  self_check_passes: 1
  max_plan_steps: 4
  peer_review_weight: 0.28
  correction_sensitivity: 0.78
  hedge_threshold: 0.60
  verbosity_budget: 0.18
  retry_limit: 2
  branch_factor: 2
  enforce_format_strictness: 0.88
memory_config:
  memory_mode: none
  allow_long_term_write: false
  summary_length_budget: 128
  inheritance_mode: none
tool_config:
  tools_enabled: false
  allowed_tools: []
  tool_choice_mode: disabled
  max_tool_calls_per_task: 0
runtime_config:
  temperature: 0.2
  max_tokens: 240
  timeout_seconds: 30
  deterministic_mode: true
  random_seed: 23
  parallel_trials: 1
  trace_capture_enabled: true
metadata:
  role: support_parent
