[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "01evolve"
version = "0.1.0"
description = "Inspectable agent evolution harness for 01Deck and 01protocol"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "pydantic>=2.8",
  "pyyaml>=6.0.2",
  "sqlalchemy>=2.0",
  "typer>=0.16",
  "uvicorn>=0.35",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
evolve = "app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["app"]
