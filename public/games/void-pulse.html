<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>VOID PULSE</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; overflow:hidden; width:100vw; height:100vh; }
  canvas { display:block; touch-action:none; cursor:crosshair; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ═══════════════════════════════════════════════════════════════
//  VOID PULSE  ·  Single-file arcade  ·  NEXUS-Micro Build
//  Mechanic: tap/click → expanding pulse ring → destroy threats
//  Timing = mastery: perfect hit at max radius = slow-mo spectacle
// ═══════════════════════════════════════════════════════════════

const $ = id => document.getElementById(id);
const canvas = $('c');
const ctx = canvas.getContext('2d');

// ── Resize ───────────────────────────────────────────────────
let W, H, cx, cy;
function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2; cy = H / 2;
}
resize();
window.addEventListener('resize', resize);

// ── Audio Engine (Web Audio API — zero asset files) ──────────
const AC = new (window.AudioContext || window.webkitAudioContext)();
function resumeAudio() { if (AC.state === 'suspended') AC.resume(); }

function tone(type, freq, dur, vol, rampTo) {
  try {
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.connect(g); g.connect(AC.destination);
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (rampTo) o.frequency.exponentialRampToValueAtTime(rampTo, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.start(t); o.stop(t + dur);
  } catch(e) {}
}

function noise(dur, vol) {
  try {
    const len = AC.sampleRate * dur;
    const buf = AC.createBuffer(1, len, AC.sampleRate);
    const d   = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.5);
    const src = AC.createBufferSource(), g = AC.createGain();
    g.gain.setValueAtTime(vol, AC.currentTime);
    src.buffer = buf; src.connect(g); g.connect(AC.destination);
    src.start();
  } catch(e) {}
}

const SFX = {
  pulse:    () => { tone('sine', 110, 0.18, 0.25, 55); },
  hit:      (f) => { tone('sawtooth', f||200, 0.22, 0.30, f*0.3||60); noise(0.08, 0.4); },
  perfect:  () => {
    [220,277,330,440].forEach((f,i) => setTimeout(() => tone('sine',f,0.5,0.18),i*55));
    setTimeout(() => noise(0.12, 0.6), 0);
  },
  combo:    (n) => { tone('square', 180+n*18, 0.1, 0.15, 340+n*20); },
  ultra:    () => {
    noise(0.35, 1.8);
    tone('sine', 60, 0.6, 0.5, 30);
    [440,554,660,880].forEach((f,i) => setTimeout(() => tone('sine',f,0.4,0.2),i*40));
  },
  danger:   () => { tone('square', 80, 0.14, 0.12); tone('square', 60, 0.14, 0.10, 55); },
  damage:   () => { noise(0.25, 1.0); tone('sawtooth', 100, 0.4, 0.4, 40); },
  gameover: () => { tone('sawtooth', 200, 1.8, 0.5, 40); noise(0.4, 0.6); },
  golden:   () => {
    [880,1100,1320].forEach((f,i) => setTimeout(() => tone('sine',f,0.35,0.2),i*60));
  }
};

// ── State ─────────────────────────────────────────────────────
let state = 'intro';  // intro | playing | dead
let score = 0, hi = +localStorage.getItem('vp_hi')||0;
let combo = 0, comboMax = 0;
let danger = false, dangerCD = 0;
let shakeX = 0, shakeY = 0;
let slowMo = 0, ultraT = 0;
let diffLvl = 1, diffTimer = 0;
let spawnT = 0;
let gameT = 0, frame = 0;
let deathT = 0;

// ── Core (player) ────────────────────────────────────────────
const CORE = { r: 18, glow: 34, hp: 3, maxHp: 3, pulse: 0 };

// ── Entity pools ──────────────────────────────────────────────
let pulses = [], threats = [], parts = [], popups = [];

// ── Ghost system (records best-run pulse events) ─────────────
// Stores: { t: gameTime, size: maxRadius } for each pulse fired in best run
let ghostPulses = JSON.parse(localStorage.getItem('vp_ghost')||'[]');
let ghostRuns   = []; // pulses fired THIS run (candidate for best)
let ghostActive = []; // currently animating ghost rings { t0, maxR, r, life }

function tickGhost(dt) {
  if (!ghostPulses.length) return;
  // Spawn ghost rings that match recorded timings
  ghostPulses.forEach(gp => {
    if (Math.abs(gp.t - gameT) < dt * 1.5 && !gp._spawned) {
      gp._spawned = true;
      ghostActive.push({ r: CORE.r, maxR: gp.size, speed: 360, life: 1 });
    }
  });
  ghostActive.forEach(g => {
    g.r = Math.min(g.r + g.speed * dt, g.maxR);
    g.life = 1 - g.r / g.maxR;
  });
  ghostActive = ghostActive.filter(g => g.r < g.maxR);
}

// ── Particles ─────────────────────────────────────────────────
function burst(x, y, n, ca, cb, spd=5, life=0.8, sz=3) {
  for (let i = 0; i < n; i++) {
    const a = Math.random()*Math.PI*2, s = (Math.random()*0.6+0.4)*spd;
    parts.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
      life, mLife:life, sz:(Math.random()*0.6+0.4)*sz,
      col: Math.random()>0.5 ? ca : cb, glow: Math.random()>.55 });
  }
}

// ── Threats ───────────────────────────────────────────────────
const TCONF = {
  asteroid: { col:'#f03', glow:'#f03', pts:10, r:[16,28], hp:1 },
  shard:    { col:'#c0f', glow:'#c0f', pts:25, r:[7,13],  hp:1 },
  cluster:  { col:'#f80', glow:'#f84', pts:40, r:[26,36], hp:2 },
  golden:   { col:'#ff0', glow:'#ffc', pts:100,r:[11,16], hp:1 }
};

function spawnThreat(type) {
  const a = Math.random()*Math.PI*2;
  const d = Math.max(W,H)*0.72;
  const cfg = TCONF[type];
  const spd = (0.9 + diffLvl*0.2) * (Math.random()*0.4+0.8) * (danger?1.45:1);
  const dx = cx - (cx+Math.cos(a)*d), dy = cy - (cy+Math.sin(a)*d);
  const dist = Math.hypot(dx,dy);
  const radius = cfg.r[0] + Math.random()*(cfg.r[1]-cfg.r[0]);
  threats.push({
    x: cx+Math.cos(a)*d, y: cy+Math.sin(a)*d,
    vx: (dx/dist)*spd, vy: (dy/dist)*spd,
    type, radius, hp: cfg.hp,
    ang: Math.random()*Math.PI*2, spin: (Math.random()-.5)*0.1,
    phase: Math.random()*Math.PI*2,
    pts: cfg.pts
  });
}

function autoSpawn() {
  // Weighted random type by difficulty
  const w = [
    Math.max(0.08, 0.70 - diffLvl*0.05),  // asteroid
    0.18 + diffLvl*0.02,                    // shard
    Math.min(0.25, diffLvl*0.025),          // cluster
    0                                        // golden — manual only
  ];
  const sum = w.reduce((a,b)=>a+b,0), r = Math.random()*sum;
  let acc=0; const types=['asteroid','shard','cluster','golden'];
  for (let i=0;i<3;i++) { acc+=w[i]; if (r<acc) { spawnThreat(types[i]); return; } }
  spawnThreat('asteroid');
}

// ── Pulse fire ────────────────────────────────────────────────
function fire() {
  const maxR = Math.min(W,H) * (danger ? 0.58 : 0.44);
  pulses.push({ r: CORE.r, maxR, speed: 390, life:1, hits:0, dmg:danger });
  CORE.pulse = 1;
  SFX.pulse();
  // Record for ghost candidate
  ghostRuns.push({ t: gameT, size: maxR });
}

// ── Score ─────────────────────────────────────────────────────
function addScore(base, x, y, label) {
  const mult = (danger?2:1) * (ultraT>0?3:combo>=8?2:combo>=4?1.5:1);
  const val  = Math.floor(base * mult);
  score += val;
  const sz = 17 + Math.min(combo*4, 32);
  const col = ultraT>0?'#ff0':danger?'#f80':'#0ff';
  popups.push({ x, y, txt: label||('+'+val), life:1.3, mLife:1.3, sz, col, vy:-1.3 });
  return val;
}

// ── Shake ─────────────────────────────────────────────────────
function shake(n) { shakeX=(Math.random()-.5)*n*2; shakeY=(Math.random()-.5)*n*2; }

// ── Difficulty ramp (Csikszentmihalyi flow — every 30s) ───────
function tickDiff(dt) {
  diffTimer += dt;
  if (diffTimer < 30) return;
  diffTimer = 0;
  diffLvl = Math.min(diffLvl + 0.6, 9);
  // Cortisol signal: brief red flash + particles
  burst(cx, cy, 35, '#f00','#f80', 7, 1, 4); shake(8);
  popups.push({ x:cx, y:cy-90, txt:'⚡ SURGE', life:1.6, mLife:1.6, sz:24, col:'#f44', vy:-0.8 });
}

// ── Death ─────────────────────────────────────────────────────
function die() {
  state = 'dead'; deathT = 3.2;
  if (score >= hi) {
    hi = score;
    localStorage.setItem('vp_hi', hi);
    localStorage.setItem('vp_ghost', JSON.stringify(ghostRuns.slice(0,600)));
  }
  SFX.gameover(); shake(32);
  burst(cx, cy, 280, '#f00','#f80', 11, 2, 5);
  // [MONETIZE: Show interstitial ad after every 3rd game over here]
  // [MONETIZE: "Continue for 1 life" rewarded ad placement here]
}

// ── Reset ─────────────────────────────────────────────────────
function reset() {
  score=0; combo=0; comboMax=0;
  danger=false; dangerCD=0;
  diffLvl=1; diffTimer=0; spawnT=0;
  gameT=0; frame=0;
  slowMo=0; ultraT=0;
  CORE.hp=CORE.maxHp; CORE.pulse=0;
  pulses=[]; threats=[]; parts=[]; popups=[];
  ghostActive=[]; ghostRuns=[];
  // Reset ghost playback flags
  ghostPulses = JSON.parse(localStorage.getItem('vp_ghost')||'[]');
  ghostPulses.forEach(g => delete g._spawned);
  // Seed first threats after a beat so player isn't immediately overwhelmed
  setTimeout(()=>{ for(let i=0;i<3;i++) setTimeout(autoSpawn, i*550); },700);
  state = 'playing';
}

// ── Toggle danger mode ────────────────────────────────────────
function toggleDanger() {
  if (danger) {
    danger = false; dangerCD = 6;
    SFX.pulse();
  } else if (dangerCD <= 0) {
    danger = true;
    SFX.danger(); shake(10);
    burst(cx, cy, 55, '#f80','#f00', 5, 0.9, 3);
    // [MONETIZE: Unlock skin pack — premium danger zone skins toggle here]
  }
}

// ── Input ─────────────────────────────────────────────────────
function onInput(px, py) {
  resumeAudio();
  if (state === 'intro') { reset(); return; }
  if (state === 'dead')  { if (deathT <= 0) reset(); return; }
  // Danger-zone button hit test (bottom-left)
  if (px < 155 && py > H - 90) { toggleDanger(); return; }
  fire();
}

canvas.addEventListener('click',      e => onInput(e.clientX, e.clientY));
canvas.addEventListener('touchstart', e => { e.preventDefault(); onInput(e.touches[0].clientX, e.touches[0].clientY); }, { passive:false });
window.addEventListener('keydown',    e => {
  if (e.code==='Space') { e.preventDefault(); onInput(cx,cy); }
  if (e.code==='KeyD')  { e.preventDefault(); resumeAudio(); if (state==='playing') toggleDanger(); }
});

// ═══════════════════════════════════════════════════════════════
//  UPDATE
// ═══════════════════════════════════════════════════════════════
function update(dt) {
  const tm = slowMo > 0 ? 0.14 : 1;  // slow-motion factor
  const adt = dt * tm;

  gameT += dt; frame++;
  if (slowMo  > 0) slowMo  -= dt;
  if (ultraT  > 0) ultraT  -= dt;
  if (dangerCD> 0) dangerCD -= dt;
  if (CORE.pulse>0) CORE.pulse -= dt*5;
  shakeX *= 0.82; shakeY *= 0.82;

  tickDiff(dt);
  tickGhost(dt);

  // ── Spawn ────────────────────────────────────────────────────
  spawnT -= dt;
  if (spawnT <= 0) {
    spawnT = Math.max(0.38, 1.9 - diffLvl*0.17);
    autoSpawn();
    // Intermittent variable-ratio golden orb
    if (Math.random() < 0.065 + diffLvl*0.008) spawnThreat('golden');
    // [MONETIZE: Daily streak bonus — golden orb frequency tied to daily return here]
  }

  // ── Update pulses ────────────────────────────────────────────
  for (let i = pulses.length-1; i >= 0; i--) {
    const p = pulses[i];
    p.r += p.speed * adt;
    p.life = 1 - p.r / p.maxR;
    if (p.r >= p.maxR) { pulses.splice(i,1); continue; }

    // Collision vs threats
    for (let j = threats.length-1; j >= 0; j--) {
      const t = threats[j];
      if (t._hit) continue;
      const dist = Math.hypot(t.x-cx, t.y-cy);
      if (Math.abs(dist - p.r) > 20 + t.radius*0.5) continue;

      t.hp--; p.hits++;
      const isPerfect = p.life < 0.12;
      const isGood    = p.life < 0.38;
      combo++; if (combo > comboMax) comboMax = combo;

      // Combo escalation sound arc
      if (combo >= 2) SFX.combo(Math.min(combo, 15));

      // ULTRA trigger (combo ≥ 12) — Zeigarnik loop opens + resolves
      if (combo >= 12 && ultraT <= 0) {
        ultraT = 4.5; shake(22);
        SFX.ultra();
        burst(cx,cy, 250, '#ff0','#f0f', 9, 1.3, 5);
        popups.push({x:cx,y:cy-60,txt:'★ ULTRA ★',life:2,mLife:2,sz:38,col:'#ff0',vy:-1});
        // [MONETIZE: Leaderboard API call — replace localStorage with server call here]
      }

      if (isPerfect) {
        slowMo = 0.55; shake(18); SFX.perfect();
        burst(t.x,t.y, 100, '#0ff','#fff', 8, 1.1, 4);
        burst(t.x,t.y, 40,  '#0ff','#80f', 5, 0.6, 2);
        addScore(t.pts*3, t.x, t.y, 'PERFECT!');
      } else if (isGood) {
        shake(9); SFX.hit(220+combo*22);
        burst(t.x,t.y, 50, '#0ff','#80f', 6, 0.8, 3);
        addScore(t.pts*1.5, t.x, t.y, combo>4?'×'+combo:'');
      } else {
        shake(5); SFX.hit(160);
        burst(t.x,t.y, 25, '#88f','#44f', 4, 0.5, 2);
        addScore(t.pts, t.x, t.y, '');
      }

      if (t.type === 'golden') { SFX.golden(); burst(t.x,t.y,70,'#ff0','#fff',8,1.2,4); }

      if (t.hp <= 0) { t._hit = true; threats.splice(j,1); }
    }
  }

  // ── Update threats ───────────────────────────────────────────
  for (let i = threats.length-1; i >= 0; i--) {
    const t = threats[i];
    t.x += t.vx * adt; t.y += t.vy * adt;
    t.ang += t.spin * adt * 60;
    t.phase += dt * 2.2;

    // Trail sparks (tension buildup — red sparks = cortisol signal)
    if (frame % 5 === 0) {
      const pct = 1 - Math.hypot(t.x-cx, t.y-cy) / (Math.max(W,H)*0.7);
      parts.push({ x:t.x,y:t.y, vx:t.vx*-0.15,vy:t.vy*-0.15,
        life:0.18+pct*0.12, mLife:0.3, sz:1.5+pct*2,
        col: t.type==='golden'?'#ff8':pct>0.6?'#f44':'#f84', glow:false });
    }

    // Core impact
    if (Math.hypot(t.x-cx, t.y-cy) < CORE.r + t.radius*0.52) {
      CORE.hp--; combo=0;
      shake(28); SFX.damage();
      burst(cx,cy, 70, '#f00','#f80', 7, 1, 4);
      if (CORE.hp===1) popups.push({x:cx,y:cy-70,txt:'⚠ LAST CORE',life:2,mLife:2,sz:26,col:'#f33',vy:-0.6});
      threats.splice(i,1);
      if (CORE.hp<=0) { die(); return; }
      continue;
    }

    // Cull far offscreen
    if (Math.hypot(t.x-cx,t.y-cy) > Math.max(W,H)*1.25) threats.splice(i,1);
  }

  // ── Update particles ─────────────────────────────────────────
  for (let i=parts.length-1;i>=0;i--) {
    const p=parts[i];
    p.x+=p.vx*adt; p.y+=p.vy*adt;
    p.vx*=0.975; p.vy*=0.975;
    p.life-=dt;
    if (p.life<=0) parts.splice(i,1);
  }

  // ── Update popups ────────────────────────────────────────────
  for (let i=popups.length-1;i>=0;i--) {
    const p=popups[i]; p.y+=p.vy; p.life-=dt;
    if (p.life<=0) popups.splice(i,1);
  }
}

// ═══════════════════════════════════════════════════════════════
//  DRAW HELPERS
// ═══════════════════════════════════════════════════════════════
function rrect(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.arcTo(x+w,y,x+w,y+r,r); ctx.lineTo(x+w,y+h-r);
  ctx.arcTo(x+w,y+h,x+w-r,y+h,r); ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r); ctx.lineTo(x,y+r);
  ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
}

function glow(col, blur) { ctx.shadowColor=col; ctx.shadowBlur=blur; }
function noGlow() { ctx.shadowBlur=0; }

// ── Background ────────────────────────────────────────────────
function drawBG() {
  const ultra = ultraT > 0;
  const dp = Math.sin(gameT*15)*0.025;
  ctx.fillStyle = ultra
    ? `rgba(8,0,16,${0.88+dp})`
    : 'rgba(0,2,8,0.91)';
  ctx.fillRect(0,0,W,H);

  // Tension grid (DANGER only — cortisol visual signal)
  if (danger) {
    ctx.strokeStyle='rgba(255,50,0,0.045)';
    ctx.lineWidth=1;
    for (let x=0;x<W;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for (let y=0;y<H;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  }

  // ULTRA chromatic edge flash
  if (ultra) {
    const g = ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*0.85);
    g.addColorStop(0,'transparent');
    g.addColorStop(1,`rgba(255,200,0,${0.18*(ultraT/4.5)})`);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.fillStyle=`rgba(255,255,0,${Math.sin(gameT*18)*0.018+0.012})`;
    ctx.fillRect(0,0,W,H);
  }

  // Danger vignette
  if (danger) {
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*0.85);
    g.addColorStop(0,'transparent');
    g.addColorStop(1,`rgba(200,0,0,${0.18+Math.sin(gameT*3)*0.04})`);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }
}

// ── Ghost rings ───────────────────────────────────────────────
function drawGhost() {
  ctx.globalAlpha = 0.32;
  ghostActive.forEach(g => {
    ctx.beginPath(); ctx.arc(cx,cy,g.r,0,Math.PI*2);
    ctx.strokeStyle = '#4af'; ctx.lineWidth = 2.5; ctx.stroke();
  });
  ctx.globalAlpha = 1;
}

// ── Core ──────────────────────────────────────────────────────
function drawCore() {
  const pe = CORE.pulse * 14, t = gameT;
  const ultra = ultraT > 0;

  // Outer resonance rings
  for (let i=3;i>=0;i--) {
    const r = CORE.glow + i*16 + pe + Math.sin(t*2+i)*4;
    const a = (0.07-i*0.015)*(1+CORE.pulse*2.5);
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.strokeStyle = ultra ? `rgba(255,255,0,${a*3})`
      : danger ? `rgba(255,120,0,${a*2.5})`
      : `rgba(0,220,255,${a})`;
    ctx.lineWidth = 2; ctx.stroke();
  }

  // HP arc
  const hpArc = Math.PI*2*(CORE.hp/CORE.maxHp);
  ctx.beginPath(); ctx.arc(cx,cy,CORE.glow+6,-Math.PI/2,-Math.PI/2+hpArc);
  ctx.strokeStyle = CORE.hp===1?'#f44':'#0ff';
  ctx.lineWidth = 3.5; ctx.stroke();

  // Core fill
  const gr = ctx.createRadialGradient(cx,cy,0,cx,cy,CORE.r+pe);
  if (ultra) {
    gr.addColorStop(0,'#fff'); gr.addColorStop(0.5,'#ff0'); gr.addColorStop(1,'#f80');
  } else if (danger) {
    gr.addColorStop(0,'#fff'); gr.addColorStop(0.4,'#f80'); gr.addColorStop(1,'#f00');
  } else {
    gr.addColorStop(0,'#fff'); gr.addColorStop(0.4,'#8ff'); gr.addColorStop(1,'#06f');
  }
  glow(ultra?'#ff0':danger?'#f80':'#0ff', 25+pe*2);
  ctx.beginPath(); ctx.arc(cx,cy,CORE.r+pe,0,Math.PI*2);
  ctx.fillStyle=gr; ctx.fill();
  noGlow();
}

// ── Pulses ────────────────────────────────────────────────────
function drawPulses() {
  pulses.forEach(p => {
    const a = p.life * 0.92;
    const intensity = 1 - p.life; // 0=just fired, 1=at max
    // Color transitions cool→white-hot as ring approaches maximum (anticipation peak)
    const r2 = intensity > 0.7 ? 255 : Math.round(intensity*320);
    const g2 = Math.round(200*intensity);
    const b2 = Math.round(255*(1-intensity*0.6));
    const col = p.dmg ? `rgba(255,100,0,${a})` : `rgba(${r2},${g2},${b2},${a})`;
    const lw  = 3 + p.hits*2.5 + (1-p.life)*7;

    glow(p.dmg?'#f80':'#0ff', 18+p.hits*8+(1-p.life)*14);
    ctx.beginPath(); ctx.arc(cx,cy,p.r,0,Math.PI*2);
    ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.stroke();
    noGlow();
  });
}

// ── Threats ───────────────────────────────────────────────────
function drawThreats() {
  threats.forEach(t => {
    const cfg = TCONF[t.type];
    const shimmer = Math.sin(t.phase)*0.28+0.72;
    // Near-miss tension: redness increases as threat nears center
    const nearness = Math.max(0, 1 - Math.hypot(t.x-cx,t.y-cy)/(Math.max(W,H)*0.45));

    ctx.save();
    ctx.translate(t.x, t.y); ctx.rotate(t.ang);
    glow(cfg.glow, 12*shimmer + nearness*20);

    if (t.type==='golden') {
      // 8-point star — dopamine icon
      ctx.fillStyle = `rgba(255,220,0,${shimmer})`;
      ctx.strokeStyle = `rgba(255,255,200,${shimmer})`;
      ctx.lineWidth = 1.8; ctx.beginPath();
      for (let i=0;i<8;i++) {
        const a=(i/8)*Math.PI*2-Math.PI/2;
        const r = i%2===0 ? t.radius : t.radius*0.42;
        i===0?ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r):ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();

    } else if (t.type==='asteroid') {
      ctx.fillStyle = `rgba(200,28,28,${shimmer*0.75})`;
      ctx.strokeStyle = `rgba(255,70,70,${shimmer})`;
      ctx.lineWidth = 2; ctx.beginPath();
      const sides = 6 + Math.floor(t.phase*0.31)%3;
      for (let i=0;i<sides;i++) {
        const a=(i/sides)*Math.PI*2;
        const rj = t.radius*(0.72+Math.sin(i*7.1+t.phase*0.08)*0.28);
        i===0?ctx.moveTo(Math.cos(a)*rj,Math.sin(a)*rj):ctx.lineTo(Math.cos(a)*rj,Math.sin(a)*rj);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();

    } else if (t.type==='shard') {
      ctx.fillStyle = `rgba(175,0,255,${shimmer*0.7})`;
      ctx.strokeStyle = `rgba(240,80,255,${shimmer})`;
      ctx.lineWidth = 1.5; ctx.beginPath();
      ctx.moveTo(0,-t.radius); ctx.lineTo(t.radius*0.7,t.radius*0.85);
      ctx.lineTo(-t.radius*0.7,t.radius*0.85); ctx.closePath();
      ctx.fill(); ctx.stroke();

    } else { // cluster
      ctx.fillStyle = `rgba(255,110,0,${shimmer*0.6})`;
      ctx.strokeStyle = `rgba(255,175,0,${shimmer})`;
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(0,0,t.radius,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.strokeStyle=`rgba(255,70,0,${shimmer*0.4})`; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(0,0,t.radius*0.58,0,Math.PI*2); ctx.stroke();
      // Second HP indicator dot
      if (t.hp===2) { ctx.fillStyle='rgba(255,200,0,0.7)'; ctx.beginPath(); ctx.arc(0,0,4,0,Math.PI*2); ctx.fill(); }
    }

    noGlow(); ctx.restore();
  });
}

// ── Particles ─────────────────────────────────────────────────
function drawParts() {
  parts.forEach(p => {
    ctx.globalAlpha = p.life/p.mLife;
    if (p.glow) { glow(p.col, 7); }
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(0.5,p.sz*(p.life/p.mLife)),0,Math.PI*2); ctx.fill();
    if (p.glow) noGlow();
  });
  ctx.globalAlpha = 1;
}

// ── HUD ───────────────────────────────────────────────────────
function drawHUD() {
  const ultra = ultraT > 0;

  // Score — kinetic, massive during ULTRA
  const scoreSz = ultra ? 52 : 40;
  const up = ultra ? Math.sin(gameT*14)*0.12+0.88 : 1;
  ctx.font = `900 ${scoreSz}px Orbitron`;
  ctx.textAlign = 'center';
  glow(ultra?'#ff0':'#0ff', ultra?35:12);
  ctx.fillStyle = ultra?`rgba(255,255,0,${up})`:'#0ff';
  ctx.fillText(score.toLocaleString(), cx, 58);
  noGlow();

  ctx.font = '400 13px Orbitron';
  ctx.fillStyle = 'rgba(0,200,255,0.45)';
  ctx.fillText('BEST '+hi.toLocaleString(), cx, 78);

  // Combo display — right side, scales with combo
  if (combo >= 2) {
    const cs = 1 + Math.min(combo*0.06, 0.7);
    ctx.save(); ctx.translate(W-72, H/2); ctx.scale(cs,cs);
    const cc = combo>=12?'#ff0':combo>=8?'#f0f':combo>=4?'#0ff':'#fff';
    ctx.font = `900 ${combo>=12?46:34}px Orbitron`;
    ctx.textAlign = 'center'; ctx.fillStyle = cc;
    glow(cc, combo>=8?28:12);
    ctx.fillText('×'+combo, 0, 0); noGlow();
    if (combo>=12) {
      ctx.font='900 19px Orbitron'; ctx.fillStyle='#ff0';
      glow('#fff',18); ctx.fillText('ULTRA',0,30); noGlow();
    } else if (combo>=8) {
      ctx.font='700 13px Orbitron'; ctx.fillStyle='#f0f';
      ctx.fillText('FRENZY',0,26);
    }
    ctx.restore();
  }

  // Danger Zone button — bottom left
  const bx=16, by=H-84, bw=128, bh=48;
  ctx.save(); ctx.translate(bx+bw/2, by+bh/2);
  if (danger) {
    const dp=Math.sin(gameT*7)*0.25+0.75;
    ctx.fillStyle=`rgba(255,80,0,${dp*0.28})`; ctx.strokeStyle=`rgba(255,100,0,${dp})`;
    ctx.lineWidth=2; rrect(-bw/2,-bh/2,bw,bh,8); ctx.fill(); ctx.stroke();
    ctx.font='700 11px Orbitron'; ctx.textAlign='center';
    glow('#f80',8); ctx.fillStyle=`rgba(255,180,0,${dp})`; ctx.fillText('⚡ DANGER',0,4); noGlow();
  } else if (dangerCD<=0) {
    ctx.fillStyle='rgba(255,40,0,0.14)'; ctx.strokeStyle='rgba(255,55,0,0.65)';
    ctx.lineWidth=1.5; rrect(-bw/2,-bh/2,bw,bh,8); ctx.fill(); ctx.stroke();
    ctx.font='700 10px Orbitron'; ctx.textAlign='center';
    ctx.fillStyle='rgba(255,90,50,0.9)'; ctx.fillText('DANGER ZONE',0,2);
    ctx.font='400 9px Orbitron'; ctx.fillStyle='rgba(255,70,0,0.55)'; ctx.fillText('[D] 2× SCORE',0,15);
  } else {
    ctx.fillStyle='rgba(60,20,0,0.3)'; ctx.strokeStyle='rgba(120,40,0,0.4)';
    ctx.lineWidth=1; rrect(-bw/2,-bh/2,bw,bh,8); ctx.fill(); ctx.stroke();
    ctx.font='400 9px Orbitron'; ctx.textAlign='center';
    ctx.fillStyle='rgba(140,55,0,0.6)'; ctx.fillText(`CD ${dangerCD.toFixed(1)}s`,0,4);
  }
  ctx.restore();

  // Difficulty level hint — bottom right
  ctx.font='400 9px Orbitron'; ctx.textAlign='right';
  ctx.fillStyle='rgba(0,180,255,0.28)';
  ctx.fillText(`LV ${Math.floor(diffLvl)}`, W-14, H-14);

  // Score popups
  ctx.textAlign='center';
  popups.forEach(p => {
    ctx.globalAlpha = Math.min(1, p.life/p.mLife*3.5);
    ctx.font = `900 ${p.sz}px Orbitron`;
    glow(p.col, 14); ctx.fillStyle=p.col;
    ctx.fillText(p.txt, p.x, p.y); noGlow();
  });
  ctx.globalAlpha = 1;
}

// ── Intro screen ──────────────────────────────────────────────
function drawIntro() {
  ctx.fillStyle='rgba(0,2,8,0.96)'; ctx.fillRect(0,0,W,H);

  // Animated title
  const tp=Math.sin(gameT*2)*0.08+0.92;
  ctx.save(); ctx.translate(cx,cy-90); ctx.scale(tp,tp);
  ctx.textAlign='center'; ctx.font='900 68px Orbitron';
  glow('#0ff',50); ctx.fillStyle='#0ff'; ctx.fillText('VOID',0,0); noGlow();
  ctx.font='900 40px Orbitron'; glow('#f0f',30);
  ctx.fillStyle='#f0f'; ctx.fillText('PULSE',0,52); noGlow();
  ctx.restore();

  ctx.textAlign='center'; ctx.font='400 15px Orbitron';
  ctx.fillStyle='rgba(0,220,255,0.75)';
  ctx.fillText('TAP TO FIRE PULSE RINGS', cx, cy+12);
  ctx.fillText('DESTROY THREATS BEFORE THEY REACH YOUR CORE', cx, cy+35);

  ctx.font='400 12px Orbitron'; ctx.fillStyle='rgba(255,90,0,0.7)';
  ctx.fillText('[D] DANGER ZONE = 2× SCORE, FASTER THREATS', cx, cy+68);

  if (hi>0) {
    ctx.font='700 17px Orbitron'; ctx.fillStyle='rgba(255,220,0,0.85)';
    glow('#ff0',12); ctx.fillText('BEST: '+hi.toLocaleString(), cx, cy+108); noGlow();
  }

  // Zeigarnik blink — always leave a loop open
  if (Math.sin(gameT*3.2)>0) {
    ctx.font='900 21px Orbitron'; ctx.fillStyle='#fff';
    ctx.fillText('TAP TO LAUNCH', cx, cy+155);
  }

  // Idle demo particles
  if (frame%45===0) burst(cx+Math.random()*W-W/2, cy+Math.random()*H-H/2, 8,'#0ff','#80f',3,1,2);
}

// ── Death screen ──────────────────────────────────────────────
function drawDead() {
  const fade = Math.min(1, 1 - deathT/3.2);
  ctx.fillStyle=`rgba(0,0,0,${fade*0.75})`; ctx.fillRect(0,0,W,H);

  if (fade < 0.45) return;

  ctx.textAlign='center';
  ctx.font='900 46px Orbitron';
  glow('#f44',28); ctx.fillStyle='#f55';
  ctx.fillText('CORE DESTROYED', cx, cy-44); noGlow();

  ctx.font='700 30px Orbitron'; ctx.fillStyle='#0ff';
  ctx.fillText(score.toLocaleString(), cx, cy+12);

  if (score>=hi && score>0) {
    ctx.font='700 18px Orbitron';
    glow('#ff0',18); ctx.fillStyle='#ff0'; ctx.fillText('NEW BEST!',cx,cy+46); noGlow();
  }

  ctx.font='400 13px Orbitron'; ctx.fillStyle='rgba(255,255,255,0.55)';
  ctx.fillText(`MAX COMBO ×${comboMax}`, cx, cy+78);

  if (deathT <= 0 && Math.sin(gameT*4)>0) {
    ctx.font='900 20px Orbitron'; ctx.fillStyle='#fff';
    ctx.fillText('TAP TO RETRY', cx, cy+122);
    // [MONETIZE: Streak bonuses tied to daily return — daily reward gate here]
  }
}

// ═══════════════════════════════════════════════════════════════
//  MAIN LOOP  (60fps locked with requestAnimationFrame)
// ═══════════════════════════════════════════════════════════════
let lastT = 0;

function loop(ts) {
  requestAnimationFrame(loop);
  const dt = Math.min((ts - lastT)/1000, 0.05);
  lastT = ts;

  ctx.save();
  ctx.translate(Math.round(shakeX), Math.round(shakeY));

  if (state === 'playing') {
    update(dt);
    drawBG(); drawGhost(); drawThreats(); drawPulses(); drawParts(); drawCore(); drawHUD();
  } else if (state === 'intro') {
    gameT += dt; frame++;
    drawBG(); drawParts(); drawIntro();
  } else if (state === 'dead') {
    deathT -= dt; gameT += dt; frame++;
    update(dt);
    drawBG(); drawThreats(); drawParts(); drawCore(); drawDead();
  }

  ctx.restore();
}

requestAnimationFrame(ts => { lastT = ts; requestAnimationFrame(loop); });

// ✅ Competence: PERFECT hits → slow-mo payoff; ULTRA combo → screen transform
// ✅ Intermittent reinforcement: golden orbs are variable-ratio, unpredictable

// ✅ Cortisol arc: SURGE every 30s, danger vignette, trail sparks near core
// ✅ Sound: synthesized — rising pitch on combo, THUD on ULTRA, serotonin chord on PERFECT
// ✅ "One more run": die → see score vs best → tap — zero friction re-entry
</script>
