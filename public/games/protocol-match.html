<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>PROTOCOL MATCH</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
  body { background:#030509; overflow:hidden; width:100vw; height:100vh; font-family:'Space Mono', monospace; }
  canvas { display:block; cursor:crosshair; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ═══════════════════════════════════════════════════════════════
// PROTOCOL MATCH · NEXUS Game Design Unit
// Applied: Dopamine loops, Zeigarnik effect, Flow state, Tension arc
// ═══════════════════════════════════════════════════════════════

const AC = new (window.AudioContext || window.webkitAudioContext)();
function resume() { if (AC.state === 'suspended') AC.resume(); }

function sfx(type, f, dur, vol, slide) {
  try {
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide, t+dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur);
  } catch(e){}
}

const AUDIO = {
  hover: () => sfx('sine', 440, 0.05, 0.05),
  flip: () => sfx('square', 300, 0.1, 0.1, 150),
  anticipate: () => sfx('sawtooth', 800, 0.8, 0.1, 1600),
  match: (combo) => {
    const f = 400 + combo*100;
    sfx('sine', f, 0.4, 0.2);
    setTimeout(()=>sfx('sine', f*1.25, 0.5, 0.2), 80);
  },
  miss: () => sfx('sawtooth', 150, 0.3, 0.2, 50),
  tension: (level) => sfx('square', 60 + level*5, 0.1, 0.05, 50),
  ultra: () => { sfx('sawtooth', 120, 1.0, 0.3, 800); sfx('sine', 880, 0.8, 0.2); }
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
resize(); window.addEventListener('resize', resize);

const SYMBOLS = ['⊕','⊗','∞','Ω','Δ','Σ','∫','π'];
const COLORS = ['#ff3366','#ffcc00','#00ff99','#00ccff','#cc33ff','#ff6600','#3399ff','#ff66b2'];

let state = 'menu'; // menu, play, resolve, over
let grid = [];
let sel = [];
let combo = 0, maxCombo = 0;
let score = 0, hi = +localStorage.getItem('pm_hi')||0;
let time = 30, maxTime = 30; // 30s tension arc
let shake = 0, timeFreeze = 0, particles = [];
let frame = 0, t0 = performance.now();

function createBoard() {
  let pairs = [];
  for(let i=0; i<8; i++) {
    pairs.push({s:SYMBOLS[i], c:COLORS[i], idx:i, flip:0, match:0});
    pairs.push({s:SYMBOLS[i], c:COLORS[i], idx:i, flip:0, match:0});
  }
  pairs.sort(()=>Math.random()-0.5);
  
  const cols = 4, rows = 4;
  const cw = Math.min(W*0.18, 100), ch = cw*1.2;
  const gap = cw*0.2;
  const tw = cols*cw + (cols-1)*gap;
  const th = rows*ch + (rows-1)*gap;
  const sx = (W-tw)/2, sy = (H-th)/2 + 20;

  grid = pairs.map((p,i) => {
    return { ...p, 
      x: sx + (i%cols)*(cw+gap), 
      y: sy + Math.floor(i/cols)*(ch+gap), 
      w: cw, h: ch, 
      cx:0, cy:0, hover:0, pop:0
    };
  });
}

function spawnParts(x,y,c,n,spd) {
  for(let i=0;i<n;i++) {
    const a = Math.random()*Math.PI*2, s = Math.random()*spd;
    particles.push({x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, mLife:1, c, sz:Math.random()*4+2});
  }
}

function reset() {
  createBoard();
  state = 'play'; score = 0; combo = 0; time = maxTime;
  sel = []; particles = []; shake = 0; timeFreeze = 0;
}

function checkMatch() {
  const [a,b] = sel;
  if (a.idx === b.idx) {
    a.match = 1; b.match = 1;
    combo++; maxCombo = Math.max(combo, maxCombo);
    score += (100 * combo);
    timeFreeze = 1.5; // Flow state reward: time stops
    time = Math.min(time + 2 + combo, maxTime);
    shake = 10 + combo*2;
    spawnParts(a.x+a.w/2, a.y+a.h/2, a.c, 30, 8);
    spawnParts(b.x+b.w/2, b.y+b.h/2, b.c, 30, 8);
    AUDIO.match(combo);
    if(combo >= 4) { AUDIO.ultra(); shake = 25; }
    if(grid.every(g=>g.match)) {
        setTimeout(()=>{ state='over'; if(score>hi){hi=score; localStorage.setItem('pm_hi',hi);} }, 1000);
    }
  } else {
    combo = 0;
    a.flip = 0; b.flip = 0;
    shake = 5; AUDIO.miss();
  }
  sel = [];
}

canvas.addEventListener('pointerdown', e => {
  resume();
  if (state==='menu' || state==='over') { reset(); return; }
  if (state!=='play' || sel.length >= 2) return;
  const x=e.clientX, y=e.clientY;
  
  for (let c of grid) {
    if (x>c.x && x<c.x+c.w && y>c.y && y<c.y+c.h && c.flip===0 && !c.match) {
      c.flip = 1; c.pop = 1;
      sel.push(c);
      AUDIO.flip();
      if (sel.length === 1) {
        // If one is selected, we wait
      } else if (sel.length === 2) {
        // DOPAMINE ANTICIPATION: The pause before resolution
        state = 'resolve';
        AUDIO.anticipate();
        setTimeout(() => { checkMatch(); state='play'; }, 600); // 600ms tension hang
      }
      break;
    }
  }
});

canvas.addEventListener('pointermove', e => {
  const x=e.clientX, y=e.clientY;
  let hovered = false;
  grid.forEach(c => {
    if(x>c.x && x<c.x+c.w && y>c.y && y<c.y+c.h && !c.match) {
      if(!c.hover) AUDIO.hover();
      c.hover = Math.min(c.hover+0.2, 1);
      hovered = true;
    } else {
      c.hover = Math.max(c.hover-0.1, 0);
    }
  });
  canvas.style.cursor = hovered ? 'pointer' : 'crosshair';
});

function drawGlow(c,x,y,r) {
  const g = ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0, c); g.addColorStop(1, 'transparent');
  ctx.fillStyle=g; ctx.fillRect(x-r,y-r,r*2,r*2);
}

function update(dt) {
  frame++;
  if (state === 'play') {
    if (timeFreeze > 0) timeFreeze -= dt;
    else time -= dt;
    if (time <= 0) {
      state = 'over'; time = 0;
      if(score>hi) { hi=score; localStorage.setItem('pm_hi',hi); }
      AUDIO.miss(); shake = 20;
    }
  }
  
  if (shake>0) shake *= 0.85;
  
  particles.forEach(p => {
    p.x+=p.vx; p.y+=p.vy; p.vx*=0.95; p.vy*=0.95; p.life-=dt*1.5;
  });
  particles = particles.filter(p=>p.life>0);
  
  grid.forEach(c => {
    if(c.pop>0) c.pop -= dt*4;
  });
}

function draw() {
  ctx.save();
  ctx.translate(Math.random()*shake-shake/2, Math.random()*shake-shake/2);
  
  // Background Tension Arc
  const tension = Math.max(0, 1 - time/maxTime); // 0 to 1
  ctx.fillStyle = `rgba(${tension*40},0,${15-tension*15},1)`;
  ctx.fillRect(0,0,W,H);
  
  // Grid Lines
  ctx.strokeStyle = `rgba(255,255,255,${0.03 + tension*0.05})`;
  ctx.lineWidth = 1;
  for(let i=0;i<W;i+=50) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,H); ctx.stroke(); }
  
  if(tension > 0.7 && frame%15===0) AUDIO.tension(tension);

  // Particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life/p.mLife;
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.sz,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Cards
  grid.forEach(c => {
    if (c.match && c.pop<=0) return; // matched & animation done
    
    let pop = Math.sin(c.pop*Math.PI)*10;
    let s = 1 + c.hover*0.05 + pop*0.01;
    let cx = c.x+c.w/2, cy = c.y+c.h/2;
    
    ctx.save();
    ctx.translate(cx, cy); ctx.scale(s,s);
    
    // Card Base
    ctx.fillStyle = c.flip ? '#0d1117' : `rgba(20,30,45,${0.8+c.hover*0.2})`;
    ctx.strokeStyle = c.flip ? c.c : `rgba(255,255,255,${0.1+c.hover*0.3})`;
    ctx.lineWidth = c.flip ? 3 : 1;
    
    ctx.beginPath(); ctx.roundRect(-c.w/2,-c.h/2,c.w,c.h,8); ctx.fill(); ctx.stroke();
    
    if (c.flip) {
      drawGlow(c.c.replace('rgb','rgba').replace(')',',0.15)'), 0,0, c.w*0.8);
      ctx.fillStyle = c.c;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `bold ${c.w*0.5}px monospace`;
      ctx.fillText(c.s, 0, 0);
    }
    
    ctx.restore();
  });

  // HUD
  ctx.fillStyle='#fff'; ctx.textAlign='left'; ctx.font='bold 24px Space Mono';
  ctx.fillText(`SCORE: ${score}`, 30, 40);
  ctx.font='14px Space Mono'; ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.fillText(`BEST: ${hi}`, 30, 65);
  
  if(combo>1) {
    ctx.fillStyle='#00ff99'; ctx.textAlign='center'; ctx.font='bold 20px Space Mono';
    ctx.fillText(`${combo}x COMBO`, W/2, 40);
  }

  // Timer Bar
  const tW = W*0.4, tH = 6;
  ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(W/2-tW/2, 60, tW, tH);
  ctx.fillStyle = tension > 0.7 ? (frame%10<5?'#ff3366':'#fff') : (timeFreeze>0?'#00ff99':'#00ccff');
  ctx.fillRect(W/2-tW/2, 60, tW * (time/maxTime), tH);

  // States
  if(state==='menu') {
    ctx.fillStyle='rgba(0,0,0,0.8)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.fillStyle='#fff';
    ctx.font='bold 48px Space Mono'; ctx.fillText('PROTOCOL MATCH', W/2, H/2-20);
    ctx.font='18px Space Mono'; ctx.fillStyle='#00ff99';
    if(Math.sin(frame*0.1)>0) ctx.fillText('CLICK TO INITIATE', W/2, H/2+30);
  } else if (state==='over') {
    ctx.fillStyle='rgba(0,0,0,0.85)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.fillStyle='#ff3366';
    ctx.font='bold 48px Space Mono'; ctx.fillText('LINK SEVERED', W/2, H/2-20);
    ctx.fillStyle='#fff'; ctx.font='24px Space Mono'; ctx.fillText(`FINAL SCORE: ${score}`, W/2, H/2+30);
    ctx.font='16px Space Mono'; ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.fillText('CLICK TO RESTART', W/2, H/2+70);
  }

  ctx.restore();
}

function loop() {
  requestAnimationFrame(loop);
  const t1 = performance.now();
  const dt = Math.min((t1-t0)/1000, 0.05);
  t0 = t1;
  update(dt);
  draw();
}
loop();
</script>
</body>
</html>
